name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "$TAG" > VERSION
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Materialize release snapshot
        run: |
          mkdir -p .github/agents
          cp agents/compiled/*.agent.md .github/agents/
          if [ -f .github/agents/update.sh ]; then
            chmod +x .github/agents/update.sh
            echo "Including existing .github/agents/update.sh"
          fi

      - name: Verify agent regressions
        run: bash bin/verify-agent-regressions.sh

      - name: Create release archive
        run: |
          ARCHIVE="prompt-engineering-v${VERSION}.tar.gz"
          tar czf "$ARCHIVE" \
            --transform "s,^,prompt-engineering-${VERSION}/," \
            VERSION \
            README.md \
            LICENSE \
            bin/install.sh \
            .github/agents/ \
            agents/compiled/ \
            agents/kernel/ \
            agents/modes/ \
            agents/templates/ \
            agents/skills/
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/toonvanvr/prompt-engineering/v${{ env.VERSION }}/bin/install.sh | bash -s -- /path/to/project
            ```

            Or with a specific version:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/toonvanvr/prompt-engineering/v${{ env.VERSION }}/bin/install.sh | bash -s -- /path/to/project --version=${{ env.VERSION }}
            ```
