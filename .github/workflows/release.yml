name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "$TAG" > VERSION
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Create release archive
        run: |
          ARCHIVE="prompt-engineering-v${VERSION}.tar.gz"
          tar czf "$ARCHIVE" \
            --transform "s,^,prompt-engineering-${VERSION}/," \
            VERSION \
            README.md \
            LICENSE \
            .github/plugin/marketplace.json \
            plugins/orchestrator/
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
          body: |
            ## Setup

            Add to VS Code User Settings:
            ```json
            {
              "chat.plugins.enabled": true,
              "chat.plugins.marketplaces": ["toonvanvr/prompt-engineering"]
            }
            ```

            Or for local install, clone and add:
            ```json
            {
              "chat.plugins.paths": {
                "/path/to/prompt-engineering/plugins/orchestrator": true
              }
            }
            ```

            See [docs/setup.md](https://github.com/toonvanvr/prompt-engineering/blob/v${{ env.VERSION }}/docs/setup.md) for full configuration reference.
